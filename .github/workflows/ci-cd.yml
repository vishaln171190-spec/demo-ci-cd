name: Node CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------
  # CI: lint + test + build on several Node versions
  # ------------------------------------------------------------
  test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ------------------------------------------------------------
  # Build once; the SAME build is deployed to dev and then stage
  # ------------------------------------------------------------
  build:
    name: Build release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package dist/
        run: tar -czf site.tgz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tgz
          retention-days: 7

  # ------------------------------------------------------------
  # CD 1: deploy to DEV automatically
  # ------------------------------------------------------------
  deploy-dev:
    name: Dev
    needs: build
    uses: ./.github/workflows/deploy-ssh.yml
    with:
      environment: development
      env_label: dev
      deploy_path: demo-dev-cicd.vinap.in   # document root, relative to the home folder
      app_url: https://demo-dev-cicd.vinap.in
    secrets: inherit

  # ------------------------------------------------------------
  # CD 2: deploy to STAGE after dev succeeds AND a reviewer approves
  # (approval is set on the "staging" environment in GitHub settings)
  # ------------------------------------------------------------
  deploy-stage:
    name: Stage
    needs: deploy-dev
    uses: ./.github/workflows/deploy-ssh.yml
    with:
      environment: staging
      env_label: stage
      deploy_path: demo-stage-ci-cd.vinap.in   # document root, relative to the home folder
      app_url: https://demo-stage-ci-cd.vinap.in
    secrets: inherit
