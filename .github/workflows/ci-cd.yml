name: Node CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------
  # CI: lint + test on several Node versions
  # ------------------------------------------------------------
  test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ------------------------------------------------------------
  # Package once; the SAME package is deployed to dev and stage
  # ------------------------------------------------------------
  package:
    name: Package release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release.tgz
        run: tar -czf release.tgz src package.json package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tgz
          retention-days: 7

  # ------------------------------------------------------------
  # CD 1: deploy to DEV automatically
  # ------------------------------------------------------------
  deploy-dev:
    name: Dev
    needs: package
    uses: ./.github/workflows/deploy-cpanel.yml
    with:
      environment: development
      env_label: dev
      app_root: demo-dev-cicd
      app_url: https://demo-dev-cicd.vinap.in
    secrets: inherit

  # ------------------------------------------------------------
  # CD 2: deploy to STAGE after dev succeeds AND a reviewer approves
  # (approval is set on the "staging" environment in GitHub settings)
  # ------------------------------------------------------------
  deploy-stage:
    name: Stage
    needs: deploy-dev
    uses: ./.github/workflows/deploy-cpanel.yml
    with:
      environment: staging
      env_label: stage
      app_root: demo-stage-ci-cd
      app_url: https://demo-stage-ci-cd.vinap.in
    secrets: inherit
