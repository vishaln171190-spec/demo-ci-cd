name: Node CI-CD

# Branch → environment:
#   push to dev   → test → build → deploy to DEV   (demo-dev-cicd.vinap.in)
#   push to main  → test → build → deploy to STAGE (demo-stage-ci-cd.vinap.in)
#   pull requests → test only (nothing is deployed)
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  # ------------------------------------------------------------
  # CI: lint + test + build on several Node versions
  # ------------------------------------------------------------
  test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ------------------------------------------------------------
  # Build the release (only for pushes to dev or main)
  # ------------------------------------------------------------
  build:
    name: Build release
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package dist/
        run: tar -czf site.tgz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tgz
          retention-days: 7

  # ------------------------------------------------------------
  # CD: dev branch → DEV
  # ------------------------------------------------------------
  deploy-dev:
    name: Dev
    needs: build
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-ssh.yml
    with:
      environment: development
      env_label: dev
      deploy_path: demo-dev-cicd.vinap.in   # document root, relative to the home folder
      app_url: https://demo-dev-cicd.vinap.in
    secrets: inherit

  # ------------------------------------------------------------
  # CD: main branch → STAGE
  # (add "Required reviewers" on the "staging" environment for an extra approval step)
  # ------------------------------------------------------------
  deploy-stage:
    name: Stage
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-ssh.yml
    with:
      environment: staging
      env_label: stage
      deploy_path: demo-stage-ci-cd.vinap.in   # document root, relative to the home folder
      app_url: https://demo-stage-ci-cd.vinap.in
    secrets: inherit
