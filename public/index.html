<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI/CD Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Node.js CI/CD Demo</h1>
    <p><span id="env-badge" class="badge">loading…</span></p>

    <table class="info">
      <tr><td>Version</td><td><b id="version">-</b></td></tr>
      <tr><td>Commit</td><td><code id="commit">-</code></td></tr>
      <tr><td>Pipeline run</td><td id="run">-</td></tr>
      <tr><td>Built at</td><td id="built-at">-</td></tr>
      <tr><td>Deployed at</td><td id="deployed-at">-</td></tr>
    </table>

    <h2>Calculator</h2>
    <form id="calc">
      <input id="a" type="number" value="2" aria-label="First number">
      <select id="op" aria-label="Operation">
        <option value="add">+</option>
        <option value="multiply">×</option>
      </select>
      <input id="b" type="number" value="3" aria-label="Second number">
      <button type="submit">=</button>
      <output id="result"></output>
    </form>

    <p class="foot">Built with Node.js and deployed automatically by GitHub Actions.</p>
  </main>

  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
